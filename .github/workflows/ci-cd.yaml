name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - feature/eid-greetings-platform

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set branch tag
        run: |
          BRANCH=$(echo ${{ github.ref_name }} | tr '/' '-')
          echo "BRANCH_TAG=${BRANCH}" >> $GITHUB_ENV

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/backend:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/backend:${{ env.BRANCH_TAG }}-latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/frontend:${{ env.BRANCH_TAG }}-latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Update image tags
        run: |
          sed -i "s|image: .*backend.*|image: ghcr.io/${{ env.REPO }}/backend:${{ github.sha }}|" k8s/backend.yaml
          sed -i "s|image: .*frontend.*|image: ghcr.io/${{ env.REPO }}/frontend:${{ github.sha }}|" k8s/frontend.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "ci: update image tags [${{ github.ref_name }}] ${{ github.sha }}"
          git push
